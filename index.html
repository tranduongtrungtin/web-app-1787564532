<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học Viện Đất Đen - Dữ Liệu Thật, Thị Trường Thật</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: '#0A2F1D',
            basalt: '#794028',
            gold: '#D4AF37',
            sand: '#F7F5F0'
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Font CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F7F5F0] text-gray-900 selection:bg-gold selection:text-forest">

  <!-- HEADER & NAVIGATION -->
  <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-forest/90 backdrop-blur-md border-b border-gold/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-full bg-basalt border-2 border-gold flex items-center justify-center text-gold font-bold text-lg shadow-lg group-hover:rotate-12 transition-transform">
          <i class="fa-solid font-bold fa-seedling"></i>
        </div>
        <div>
          <span class="block font-serif-title font-bold text-lg tracking-wider text-white uppercase">Học Viện Đất Đen</span>
          <span class="block text-[10px] tracking-widest text-gold uppercase font-semibold">Healing Soil • Healing People</span>
        </div>
      </a>

      <!-- Menu Navigation -->
      <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-200">
        <a href="#triet-ly" class="hover:text-gold transition-colors">Triết Lý Cốt Lõi</a>
        <a href="#ho-chieu" class="hover:text-gold transition-colors">3 Lớp Dữ Liệu</a>
        <a href="#dao-tao" class="hover:text-gold transition-colors">Khóa Đào Tạo</a>
        <a href="#tra-cuu" class="hover:text-gold transition-colors">Tra Cứu Hộ Chiếu</a>
        <a href="#lien-he" class="hover:text-gold transition-colors">Đăng Ký Hợp Tác</a>
      </nav>

      <!-- Action Buttons -->
      <div class="flex items-center gap-4">
        <a href="#tra-cuu" class="hidden sm:inline-flex items-center gap-2 px-4 py-2 text-xs font-semibold uppercase tracking-wider text-gold border border-gold rounded-md hover:bg-gold hover:text-forest transition-all shadow-md">
          <i class="fa-solid fa-qrcode"></i> Tra Cứu Lô Hàng
        </a>
        <a href="admin.html" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 text-xs font-semibold uppercase tracking-wider text-white bg-basalt rounded-md hover:bg-amber-800 transition-all shadow-md border border-gold/30">
          <i class="fa-solid fa-user-shield"></i> Admin Portal
        </a>
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="relative pt-32 pb-20 md:pt-40 md:pb-32 basalt-gradient text-white overflow-hidden">
    <!-- Decorative Soil Background Effects -->
    <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#D4AF37_1px,transparent_1px)] [background-size:24px_24px]"></div>
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-gold/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 right-0 h-24 bg-gradient-to-t from-[#F7F5F0] to-transparent"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="grid lg:grid-cols-12 gap-12 items-center">
        <!-- Hero Content -->
        <div class="lg:col-span-7 space-y-6 text-center lg:text-left">
          <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-forest/80 border border-gold/40 text-gold text-xs font-semibold uppercase tracking-wider shadow-inner">
            <i class="fa-solid fa-leaf text-green-400"></i> Nền Tảng Minh Bạch Nông Nghiệp
          </div>
          <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold font-serif-title leading-tight tracking-tight">
            DỮ LIỆU THẬT <br>
            <span class="gold-gradient-text">THỊ TRƯỜNG THẬT</span>
          </h1>
          <p class="text-lg sm:text-xl text-gray-300 font-light max-w-2xl leading-relaxed italic border-l-2 border-gold/60 pl-4 my-4">
